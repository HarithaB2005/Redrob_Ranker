ai_usage_summary: |
  Used Claude for architectural discussion, code review, and prompt strategy.
  No candidate data was fed to any external LLM during the ranking step.
  The ranking pipeline is fully deterministic, CPU-only, and makes zero
  API calls at inference time.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Five-dimension deterministic ranker. Stage 1: hard filter removes wrong-domain
  candidates (consulting-only careers, non-AI primary specialties). Stage 2:
  parallel scoring across skill match (35%), career trajectory (25%), behavioral
  signals (25%), location fit (10%), and education (5%). Skill matching uses
  semantic category coverage across 5 JD-derived requirement clusters — not
  keyword counting — to resist the keyword-stuffing trap the JD warns about.
  Career trajectory scores product-company vs consulting ratio, domain relevance
  in actual job descriptions, and title progression velocity. Behavioral signals
  implement the JD's explicit guidance: candidates inactive >180 days with <10%
  response rate receive a 0.5x composite multiplier. Stage 3: top-200 reranked
  with title alignment, GitHub, and triple-availability bonuses. Reasoning
  generated from structured data only — no hallucination possible.
  Runtime: ~34 seconds for 100K candidates on a standard CPU.

